services:
  - type: web
    name: ashtra-backend
    runtime: python
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -c "from app.main import app; print('import ok')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DOCS_ENABLED
        value: 0
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: VISION_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: VISION_MODEL
        value: inclusionai/ling-3.0-flash-vl:free,google/gemma-4-26b-a4b-it:free
