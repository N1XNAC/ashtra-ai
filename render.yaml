services:
  - type: web
    name: ashtra-backend
    runtime: python
    rootDir: backend
    buildCommand: CARGO_HOME=/tmp/cargo pip install -r requirements.txt --only-binary :all:
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DOCS_ENABLED
        value: 0
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: VISION_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: VISION_MODEL
        value: inclusionai/ling-3.0-flash-vl:free,google/gemma-4-26b-a4b-it:free
