# Ashtra backend on Render free tier (no card) + Supabase free Postgres (no card).
# Dashboard: New → Blueprint → pick repo (render.yaml auto-detected).
# Then set the 6 secret envVars below in the dashboard after first deploy.
services:
  - type: web
    name: ashtra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DOCS_ENABLED
        value: 0
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: VISION_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: VISION_MODEL
        value: inclusionai/ling-3.0-flash-vl:free,google/gemma-4-26b-a4b-it:free
# Notes: free tier sleeps after 15 min idle (~30–60s wake).
# Postgres (Supabase) + pgvector survive cold starts. After a cold start, hit
# POST /memories/{user}/reindex once to rebuild vectors from Postgres.
