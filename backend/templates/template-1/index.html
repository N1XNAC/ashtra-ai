<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020816" />
    <title>Meridian — Move payments forward together</title>
    <meta name="description" content="Meridian — Move payments forward together" />
    <meta property="og:title" content="Meridian — Move payments forward together" />
    <meta property="og:description" content="Meridian — Move payments forward together" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      @font-face {
        font-family: "M Display";
        src: url(assets/fonts/m-display.woff2) format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "M Sans";
        src: url(assets/fonts/m-sans.woff2) format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "M Mono";
        src: url(assets/fonts/m-mono-bold.woff2) format("woff2");
        font-weight: 700;
        font-display: block;
      }

      :root {
        --ink-bg: #020816;
        --glass: rgba(51, 52, 74, 0.6);
        --glass-blur: 14px;
        --navy: rgba(45, 56, 92, 0.85);
        --peach: #f2b380;
        --cta: #f93f28;
        --peach-ink: #331200;
        --white: #ffffff;
        --display: #f6f8fc;
        --body: #cfd3e0;
        --chip: #c9ccd4;
        --rail: #989eac;
        --u: 1;
        --vh: 100vh;
        --cap-shift: -0.055em;
        --f-display: "M Display", "ITC Avant Garde Gothic", "Avant Garde", "URW Gothic", "Century Gothic", sans-serif;
        --f-sans: "M Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --f-mono: "M Mono", "Courier New", Courier, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: #020816;
        color: #fff;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        background: none;
        border: none;
        padding: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      :focus-visible {
        outline: 2px solid #f2b380;
        outline-offset: 3px;
      }

      /* Hero section */
      .hero {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        height: var(--vh);
        min-height: 100%;
        overflow: hidden;
        background: #020816;
        isolation: isolate;
      }

      .photo {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        will-change: transform;
        transform-origin: 0 0;
      }

      .js .photo {
        width: calc(1586px * var(--s, 1));
        height: calc(992px * var(--s, 1));
        transform: translate3d(var(--x0, 0px), var(--y0, 0px), 0);
      }

      .photo video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 100%;
        display: block;
        user-select: none;
        -webkit-user-select: none;
      }

      .photo::after {
        content: "";
        position: absolute;
        inset: -1px;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(2, 8, 22, 1) 0%,
          rgba(2, 8, 22, 0.55) 6%,
          rgba(2, 8, 22, 0.15) 14%,
          rgba(2, 8, 22, 0) 22%,
          rgba(2, 8, 22, 0) 100%
        );
      }

      /* Top Chrome */
      .nav-l, .nav-r {
        position: absolute;
        top: 0;
        z-index: 3;
        width: 0;
        height: 0;
      }

      .nav-l {
        left: 0;
        transform-origin: 0 0;
        transform: scale(var(--u));
      }

      .nav-r {
        right: 0;
        transform-origin: 100% 0;
        transform: scale(var(--u));
      }

      .brand {
        position: absolute;
        left: 16px;
        top: 29.3px;
        display: flex;
        align-items: flex-start;
        white-space: nowrap;
      }

      .brand svg {
        width: 24px;
        height: 24px;
        overflow: visible;
        flex-shrink: 0;
      }

      .brand span {
        font-family: var(--f-sans);
        font-size: 21px;
        letter-spacing: -0.1px;
        line-height: 1;
        margin-left: 4px;
        position: relative;
        left: var(--nx);
        top: var(--ny);
      }

      .more {
        position: absolute;
        right: 29.65px;
        top: 23.83px;
        width: 80.45px;
        height: 35.35px;
        display: flex;
        align-items: center;
        padding: 0 14.76px 0 15.14px;
        background: rgba(51, 52, 74, 0.6);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-radius: 0;
        white-space: nowrap;
        transition: background-color 0.2s;
      }

      @media (hover: hover) {
        .more:hover {
          background: rgba(66, 66, 96, 0.66);
        }
      }

      .more .dots {
        width: 8.4px;
        height: 8.4px;
        position: relative;
        left: 0.2px;
        transform: translateY(0.31px);
        flex-shrink: 0;
      }

      .more span {
        font-family: var(--f-mono);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.2px;
        line-height: 1;
        margin-left: 13.4px;
        position: relative;
        left: var(--nx);
        top: calc(var(--ny) + var(--cap-shift));
      }

      .rail {
        position: absolute;
        right: 8.7px;
        top: 11.9px;
        width: 1.9px;
        height: 47.2px;
        background: #989eac;
        border-radius: 1px;
        pointer-events: none;
        transform-origin: 50% 0;
      }

      /* MORE popover */
      .more-menu {
        position: absolute;
        right: 29.65px;
        top: 65.18px;
        min-width: 196px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        background: rgba(51, 52, 74, 0.6);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        z-index: 4;
      }

      .more-menu[hidden] {
        display: none;
      }

      .more-menu a {
        font-family: var(--f-mono);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.4px;
        line-height: 1;
        padding: 12px 14px;
        color: #fff;
        white-space: nowrap;
        transition: background-color 0.2s;
      }

      @media (hover: hover) {
        .more-menu a:hover {
          background: rgba(66, 66, 96, 0.66);
        }
      }

      /* Stage */
      .stage {
        position: absolute;
        left: 50%;
        top: 0;
        width: 1280px;
        height: 800px;
        z-index: 2;
        transform-origin: 50% 0;
        transform: translateX(-50%) scale(var(--u));
      }

      .pill {
        position: absolute;
        left: 506px;
        top: 99.76px;
        height: 35.3px;
        display: flex;
        align-items: center;
        padding: 0 11.78px 0 11.92px;
        background: rgba(51, 52, 74, 0.6);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-radius: 0;
        white-space: nowrap;
        transition: background-color 0.2s;
      }

      @media (hover: hover) {
        .pill:hover {
          background: rgba(66, 66, 96, 0.66);
        }
      }

      .pill .sq {
        display: inline-block;
        width: 9.3px;
        height: 11.1px;
        background: #c9ccd4;
        position: relative;
        top: 0.1px;
        flex-shrink: 0;
      }

      .pill span {
        font-family: var(--f-mono);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.6px;
        line-height: 1;
        margin-left: 18.3px;
        position: relative;
        left: var(--nx);
        top: calc(var(--ny) + var(--cap-shift));
      }

      .pill svg {
        width: 11px;
        height: 10.5px;
        margin-left: 13.5px;
        position: relative;
        top: 0.15px;
        flex-shrink: 0;
      }

      h1 {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        margin: 0;
        text-align: center;
        white-space: nowrap;
        transform: translate(var(--nx), var(--ny));
        font-family: var(--f-display);
        font-weight: 400;
        font-size: 53px;
        letter-spacing: 0;
        line-height: 1;
        color: #f6f8fc;
      }

      h1 .w {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding: 0.08em 0 0.2em;
        margin: -0.08em 0 -0.2em;
      }

      h1 .w > span {
        display: inline-block;
      }

      p.lede {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        margin: 0;
        text-align: center;
        transform: translate(var(--nx), var(--ny));
        font-family: var(--f-sans);
        font-size: 18px;
        line-height: 23px;
        color: #cfd3e0;
      }

      br.d {
        display: inline;
      }

      .cta {
        position: absolute;
        left: 441.1px;
        top: 326.55px;
        display: flex;
        gap: 8.76px;
      }

      .btn {
        height: 51.2px;
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        font-family: var(--f-mono);
        font-weight: 700;
        font-size: 13.5px;
        letter-spacing: 0.4px;
        line-height: 1;
        transition: filter 0.2s, background-color 0.2s;
        border-radius: 0;
        border: none;
      }

      .btn span {
        position: relative;
        left: var(--nx);
        top: calc(var(--ny) + var(--cap-shift));
      }

      .b1 {
        padding: 0 30.35px;
        background: rgba(45, 56, 92, 0.85);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        color: #ffffff;
      }

      @media (hover: hover) {
        .b1:hover {
          background: rgba(58, 72, 114, 0.9);
        }
      }

      .b2 {
        padding: 0 25.92px 0 25.78px;
        background: #f93f28;
        color: #331200;
      }

      @media (hover: hover) {
        .b2:hover {
          filter: brightness(1.05);
        }
      }

      .b2 svg {
        width: 12px;
        height: 12px;
        margin-right: 22.5px;
        position: relative;
        top: 0.34px;
        flex-shrink: 0;
      }

      /* Intro state */
      html.intro .brand,
      html.intro .more,
      html.intro .rail,
      html.intro .pill,
      html.intro h1,
      html.intro .lede,
      html.intro .btn {
        opacity: 0;
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Tablet Responsive */
      @media (min-width: 511px) and (max-width: 1151.98px), (min-width: 511px) and (max-height: 719.98px) {
        :root {
          --k: 0.9;
          --gut: clamp(32px, 5vw, 48px);
        }

        .hero {
          height: auto;
          min-height: var(--vh);
        }

        .nav-l, .nav-r {
          transform: scale(var(--k));
        }

        .stage {
          position: relative;
          left: auto;
          top: auto;
          width: auto;
          height: auto;
          transform: none;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: calc(clamp(70px, 12.47vh, 89.8px) + env(safe-area-inset-top, 0px)) var(--gut) 0;
        }

        .pill, h1, p.lede, .cta {
          position: relative;
          left: auto;
          top: auto;
          transform: none;
        }

        .pill, .cta {
          zoom: var(--k);
        }

        .pill span, .btn span {
          left: 0;
          top: var(--cap-shift);
        }

        h1 {
          width: auto;
          margin-top: min(calc(24.44px * var(--k)), 2.9vh);
          font-size: clamp(40px, calc((100vw - 2 * var(--gut)) / 16.4), calc(53px * var(--k)));
        }

        p.lede {
          width: auto;
          margin-top: min(calc(24px * var(--k)), 2.85vh);
          font-size: min(calc(18px * var(--k)), calc((100vw - 2 * var(--gut)) / 27.9));
          line-height: 1.278;
        }

        .cta {
          margin-top: min(21.05px, 2.8vh);
        }

        .more::after, .pill::after {
          content: "";
          position: absolute;
          inset: -6px -2px;
        }
      }

      /* 511px - 719.98px viewport width */
      @media (min-width: 511px) and (max-width: 719.98px) {
        h1 {
          white-space: normal;
          font-size: clamp(40px, 6.9vw, 46px);
          line-height: 1.06;
          max-width: 9.6em;
          text-wrap: balance;
        }
      }

      /* Portrait Tablet */
      @media (min-width: 511px) and (max-width: 1151.98px) and (orientation: portrait) {
        :root {
          --k: 1;
        }

        .stage {
          padding-top: calc(clamp(96px, 10.5vh, 150px) + env(safe-area-inset-top, 0px));
        }

        h1 {
          white-space: normal;
          font-size: clamp(44px, 7.6vw, 78px);
          line-height: 1.04;
          max-width: 9.6em;
          text-wrap: balance;
          margin-top: clamp(24px, 2.6vh, 34px);
        }

        p.lede {
          margin-top: clamp(22px, 2.4vh, 30px);
        }

        .cta {
          margin-top: clamp(24px, 2.6vh, 34px);
        }
      }

      /* Phone */
      @media (max-width: 510.98px) {
        :root {
          --gut: clamp(20px, 5.5vw, 24px);
        }

        .hero {
          height: auto;
          min-height: 100svh;
          min-height: var(--vh);
        }

        .nav-l, .nav-r {
          transform: scale(0.88);
          top: env(safe-area-inset-top, 0px);
        }

        .stage {
          position: relative;
          left: auto;
          top: auto;
          width: auto;
          height: auto;
          transform: none;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: calc(clamp(80px, 10.5vh, 94px) + env(safe-area-inset-top, 0px)) var(--gut) 0;
        }

        .pill, h1, p.lede, .cta {
          position: relative;
          left: auto;
          top: auto;
          transform: none;
        }

        .pill {
          zoom: 0.86;
        }

        .pill span, .btn span {
          left: 0;
          top: var(--cap-shift);
        }

        h1 {
          margin-top: clamp(17px, 2.2vh, 21px);
          white-space: normal;
          font-size: clamp(32px, 9.25vw, 37px);
          line-height: 1.06;
          max-width: 9.6em;
          text-wrap: balance;
          width: auto;
        }

        p.lede {
          margin-top: clamp(13px, 1.8vh, 16px);
          font-size: clamp(14px, 3.72vw, 15px);
          line-height: 1.42;
          max-width: 32em;
          text-wrap: pretty;
          width: auto;
        }

        br.d {
          display: none;
        }

        .cta {
          margin-top: clamp(18px, 2.4vh, 22px);
          gap: 8px;
          flex-wrap: wrap;
          justify-content: center;
          width: 100%;
          max-width: 330px;
        }

        .btn {
          height: 46px;
          flex: 1 1 auto;
          justify-content: center;
          font-size: 11.5px;
          letter-spacing: 0.35px;
        }

        .b1 {
          padding: 0 clamp(13px, 3.5vw, 20px);
        }

        .b2 {
          padding: 0 calc(clamp(13px, 3.5vw, 20px) - 0.34px) 0 calc(clamp(13px, 3.5vw, 20px) + 0.34px);
        }

        .b2 svg {
          width: 11px;
          height: 11px;
          margin-right: clamp(12px, 3.5vw, 16px);
        }

        .more::after, .pill::after {
          content: "";
          position: absolute;
          inset: -8px -4px;
        }
      }
    </style>

    <script>
      (function () {
        var root = document.documentElement;
        var u = Math.min(root.clientWidth / 1280, window.innerHeight / 800);
        root.style.setProperty('--u', u);
        root.style.setProperty('--vh', window.innerHeight + 'px');
        root.classList.add('js');

        var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!prefersReducedMotion && 'animate' in document.documentElement) {
          root.classList.add('intro');
          setTimeout(function () {
            root.classList.remove('intro');
          }, 4000);
        }
      })();
    </script>
  </head>
  <body>
    <section class="hero" id="hero" aria-label="Meridian">
      <div class="photo" id="photo" aria-hidden="true">
        <video
          id="demo"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          width="1586"
          height="992"
          poster="assets/images/meridian-hero.jpg"
          src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/0e1b18f2-b590-4b97-96f0-b05e019d07eb.mp4"
        ></video>
      </div>

      <div class="nav-l">
        <a class="brand" href="#" aria-label="Meridian home" style="--nx:-0.5px; --ny:-2.75px">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff">
            <circle cx="12.2" cy="11.9" r="8.45" stroke-width="2" />
            <path d="M12.2 0.1V24" stroke-width="1.9" />
            <path d="M0 11.9H24.4" stroke-width="1.95" />
          </svg>
          <span>meridian</span>
        </a>
      </div>

      <div class="nav-r">
        <button class="more" type="button" aria-expanded="false" aria-controls="moreMenu" style="--nx:0.25px; --ny:-1.0px">
          <svg class="dots" viewBox="0 0 8.4 8.4" fill="#fff">
            <rect x="0" y="0" width="2.4" height="2.4" />
            <rect x="6" y="0" width="2.4" height="2.4" />
            <rect x="0" y="6" width="2.4" height="2.4" />
            <rect x="6" y="6" width="2.4" height="2.4" />
          </svg>
          <span>MORE</span>
        </button>
        <div class="more-menu" id="moreMenu" hidden>
          <a href="#stage">VIEW OUR WORK</a>
          <a href="#demo">PLAY SHOWREEL</a>
          <a href="mailto:hello@meridian.example">CONTACT US</a>
        </div>
        <span class="rail" aria-hidden="true"></span>
      </div>

      <main class="stage" id="stage">
        <a class="pill" href="#stage" style="--nx:0.75px; --ny:0px">
          <i class="sq"></i>
          <span>VIEW OUR MERIDIAN* WORK</span>
          <svg viewBox="0 0 11 10.5" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M1 0.9l4.2 4.35L1 9.6" />
            <path d="M6.2 0.9l4.2 4.35L6.2 9.6" />
          </svg>
        </a>

        <h1 style="--nx:-3.0px; --ny:159.5px">Move payments forward together</h1>

        <p class="lede" style="--nx:-3.0px; --ny:236.5px">
          Smart reports from teams using Meridian to manage spending,<br class="d">
          issue cards, and stay in control as they grow. Accounts stay<br class="d">
          secure, orderly, and dependable.
        </p>

        <div class="cta" id="cta">
          <a class="btn b1" href="#demo" style="--nx:-0.25px; --ny:0px">
            <span>SEE IT HAPPEN</span>
          </a>
          <a class="btn b2" href="mailto:hello@meridian.example?subject=Discuss%20a%20plan" style="--nx:0.5px; --ny:0px">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.05">
              <circle cx="2.3" cy="2.3" r="1.75" />
              <circle cx="9.7" cy="2.3" r="1.75" />
              <circle cx="2.3" cy="9.7" r="1.75" />
              <circle cx="9.7" cy="9.7" r="1.75" />
              <path d="M3.6 3.9L8.4 8.1" />
            </svg>
            <span>DISCUSS A PLAN</span>
          </a>
        </div>
      </main>
    </section>

    <script>
      (function () {
        var IW = 1586;
        var IH = 992;
        var CROWN = 530;
        var GAP_D = 49.24;
        var GAP_M = 26;
        var OVERSCAN = 1.00078;
        var K_T = 0.9;
        var MAX_ZOOM = 1.4;

        var root = document.documentElement;
        var hero = document.getElementById('hero');
        var photo = document.getElementById('photo');
        var stage = document.getElementById('stage');
        var cta = document.getElementById('cta');
        var h1 = document.querySelector('h1');
        var lede = document.querySelector('.lede');
        var brand = document.querySelector('.brand');
        var moreBtn = document.querySelector('.more');
        var rail = document.querySelector('.rail');
        var pill = document.querySelector('.pill');
        var b1 = document.querySelector('.b1');
        var b2 = document.querySelector('.b2');

        var rafId = null;

        function runLayout() {
          var vw = root.clientWidth;
          var vh = window.innerHeight;
          var u = Math.min(vw / 1280, vh / 800);
          root.style.setProperty('--u', u);
          root.style.setProperty('--vh', vh + 'px');

          var isDesk = window.matchMedia('(min-width:1152px) and (min-height:720px)').matches;
          var isPhone = window.matchMedia('(max-width:510.98px)').matches;
          var mode = isDesk ? 'd' : isPhone ? 'm' : 't';

          var ctaRect = cta.getBoundingClientRect();
          var heroRect = hero.getBoundingClientRect();
          var cb = ctaRect.bottom - heroRect.top;

          var kVal = parseFloat(getComputedStyle(root).getPropertyValue('--k'));
          var k = isNaN(kVal) ? K_T : kVal;

          var crown = cb + (mode === 'd' ? GAP_D * u : mode === 't' ? GAP_D * k : GAP_M);
          var H = hero.offsetHeight || heroRect.height || vh;
          var cover = Math.max(vw / IW, H / IH);
          var s = Math.max(cover, (H - crown) / (IH - CROWN));

          if (s > cover * MAX_ZOOM) {
            s = cover * MAX_ZOOM;
            crown = H - (IH - CROWN) * s;
          }
          s *= OVERSCAN;

          var fx = (vw / H < 1) ? 815 : IW / 2;
          var minX = vw - IW * s;
          var targetX = vw / 2 - fx * s;
          var x0 = Math.min(0, Math.max(minX, targetX));
          var y0 = crown - CROWN * s;

          photo.style.setProperty('--s', s);
          photo.style.setProperty('--x0', x0 + 'px');
          photo.style.setProperty('--y0', y0 + 'px');
        }

        function scheduleLayout() {
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(runLayout);
        }

        window.addEventListener('load', scheduleLayout);
        window.addEventListener('resize', scheduleLayout);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', scheduleLayout);
        }

        var mqDesk = window.matchMedia('(min-width:1152px) and (min-height:720px)');
        var mqPhone = window.matchMedia('(max-width:510.98px)');
        if (mqDesk.addEventListener) {
          mqDesk.addEventListener('change', scheduleLayout);
          mqPhone.addEventListener('change', scheduleLayout);
        }

        if (window.ResizeObserver) {
          var ro = new ResizeObserver(scheduleLayout);
          if (stage) ro.observe(stage);
          if (hero) ro.observe(hero);
        }

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(scheduleLayout);
        }

        scheduleLayout();

        // Entrance Animation
        var EXPO = 'cubic-bezier(.16,1,.3,1)';
        var QUART = 'cubic-bezier(.25,1,.5,1)';
        var SHUTTER = 'cubic-bezier(.76,0,.24,1)';

        var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function runEntrance() {
          if (prefersReducedMotion || !('animate' in document.documentElement)) {
            root.classList.remove('intro');
            root.classList.add('intro-done');
            return;
          }

          var isPhoneMode = window.matchMedia('(max-width:510.98px)').matches;
          var d = isPhoneMode ? 0.75 : 1;

          var originalH1HTML = h1.innerHTML;
          var words = h1.textContent.trim().split(/\s+/);
          h1.innerHTML = words.map(function (w) {
            return '<span class="w"><span>' + w + '</span></span>';
          }).join(' ');

          var wordSpans = h1.querySelectorAll('.w > span');
          var allAnimations = [];
          var wordAnimations = [];

          // Brand: opacity 0, translate 0 -8d px -> opacity 1, translate 0 0
          if (brand) {
            allAnimations.push(brand.animate([
              { opacity: 0, transform: 'translate(0, ' + (-8 * d) + 'px)' },
              { opacity: 1, transform: 'translate(0, 0)' }
            ], {
              delay: 150,
              duration: 800,
              easing: QUART,
              fill: 'backwards'
            }));
          }

          // MORE: opacity 0, translate 0 -8d px -> opacity 1, translate 0 0
          if (moreBtn) {
            allAnimations.push(moreBtn.animate([
              { opacity: 0, transform: 'translate(0, ' + (-8 * d) + 'px)' },
              { opacity: 1, transform: 'translate(0, 0)' }
            ], {
              delay: 250,
              duration: 800,
              easing: QUART,
              fill: 'backwards'
            }));
          }

          // Rail: scale 1 0 -> 1 1
          if (rail) {
            allAnimations.push(rail.animate([
              { transform: 'scaleY(0)' },
              { transform: 'scaleY(1)' }
            ], {
              delay: 350,
              duration: 900,
              easing: EXPO,
              fill: 'backwards'
            }));
          }

          // Pill: clip-path inset(0 100% 0 0) -> inset(0 0% 0 0)
          if (pill) {
            allAnimations.push(pill.animate([
              { clipPath: 'inset(0 100% 0 0)' },
              { clipPath: 'inset(0 0% 0 0)' }
            ], {
              delay: 300,
              duration: 750,
              easing: SHUTTER,
              fill: 'backwards'
            }));
          }

          // Headline, word i: inner span translate 0 132% -> 0 0
          wordSpans.forEach(function (span, i) {
            var anim = span.animate([
              { transform: 'translateY(132%)' },
              { transform: 'translateY(0)' }
            ], {
              delay: (0.45 + i * 0.055) * 1000,
              duration: 1050,
              easing: EXPO,
              fill: 'backwards'
            });
            wordAnimations.push(anim);
            allAnimations.push(anim);
          });

          // Lede: opacity 0, translate 0 12d px -> opacity 1, translate 0 0
          if (lede) {
            allAnimations.push(lede.animate([
              { opacity: 0, transform: 'translate(0, ' + (12 * d) + 'px)' },
              { opacity: 1, transform: 'translate(0, 0)' }
            ], {
              delay: 850,
              duration: 900,
              easing: QUART,
              fill: 'backwards'
            }));
          }

          // b1: clip-path inset(100% 0 0 0) -> inset(0% 0 0 0)
          if (b1) {
            allAnimations.push(b1.animate([
              { clipPath: 'inset(100% 0 0 0)' },
              { clipPath: 'inset(0% 0 0 0)' }
            ], {
              delay: 1050,
              duration: 750,
              easing: EXPO,
              fill: 'backwards'
            }));

            var b1Label = b1.querySelector('span');
            if (b1Label) {
              allAnimations.push(b1Label.animate([
                { opacity: 0, transform: 'translate(0, ' + (8 * d) + 'px)' },
                { opacity: 1, transform: 'translate(0, 0)' }
              ], {
                delay: 1150,
                duration: 700,
                easing: QUART,
                fill: 'backwards'
              }));
            }
          }

          // b2: clip-path inset(100% 0 0 0) -> inset(0% 0 0 0)
          if (b2) {
            allAnimations.push(b2.animate([
              { clipPath: 'inset(100% 0 0 0)' },
              { clipPath: 'inset(0% 0 0 0)' }
            ], {
              delay: 1130,
              duration: 750,
              easing: EXPO,
              fill: 'backwards'
            }));

            var b2Label = b2.querySelector('span');
            var b2Icon = b2.querySelector('svg');
            [b2Label, b2Icon].forEach(function (el) {
              if (el) {
                allAnimations.push(el.animate([
                  { opacity: 0, transform: 'translate(0, ' + (8 * d) + 'px)' },
                  { opacity: 1, transform: 'translate(0, 0)' }
                ], {
                  delay: 1230,
                  duration: 700,
                  easing: QUART,
                  fill: 'backwards'
                }));
              }
            });
          }

          // Remove intro in the same frame
          root.classList.remove('intro');

          // When word tweens finish, restore original markup
          Promise.all(wordAnimations.map(function (a) { return a.finished; })).then(function () {
            h1.innerHTML = originalH1HTML;
          }).catch(function () {});

          // When all tweens finish, cancel them and add intro-done
          Promise.all(allAnimations.map(function (a) { return a.finished; })).then(function () {
            allAnimations.forEach(function (a) {
              try { a.cancel(); } catch (e) {}
            });
            root.classList.add('intro-done');
          }).catch(function () {});
        }

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            requestAnimationFrame(runEntrance);
          });
        } else {
          window.addEventListener('load', function () {
            requestAnimationFrame(runEntrance);
          });
        }

        // Video playback
        var video = photo ? photo.querySelector('video') : null;
        if (video) {
          video.muted = true;
          var playSafe = function () {
            video.play().catch(function () {});
          };
          playSafe();
          video.addEventListener('canplay', playSafe);
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) playSafe();
          });
          var playOnce = function () {
            playSafe();
            window.removeEventListener('pointerdown', playOnce);
            window.removeEventListener('touchstart', playOnce);
            window.removeEventListener('scroll', playOnce);
          };
          window.addEventListener('pointerdown', playOnce, { passive: true, once: true });
          window.addEventListener('touchstart', playOnce, { passive: true, once: true });
          window.addEventListener('scroll', playOnce, { passive: true, once: true });
        }
      })();
    </script>

    <script>
      (function () {
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        var brand = document.querySelector('.brand');
        if (brand) {
          brand.addEventListener('click', function (e) {
            e.preventDefault();
          });
        }

        var moreBtn = document.querySelector('.more');
        var menu = document.getElementById('moreMenu');

        function setMenu(open) {
          if (!menu || !moreBtn) return;
          menu.hidden = !open;
          moreBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        if (moreBtn && menu) {
          moreBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            setMenu(menu.hidden);
          });

          menu.addEventListener('click', function () {
            setMenu(false);
          });

          document.addEventListener('click', function (e) {
            if (menu.hidden) return;
            if (!menu.contains(e.target) && !moreBtn.contains(e.target)) setMenu(false);
          });

          document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !menu.hidden) {
              setMenu(false);
              moreBtn.focus();
            }
          });
        }

        var video = document.querySelector('.photo video');
        var photo = document.getElementById('photo');

        function replayShowreel() {
          if (video) {
            try {
              video.currentTime = 0;
            } catch (err) {}
            video.muted = true;
            video.play().catch(function () {});
          }
          if (!reduceMotion && photo && photo.animate) {
            try {
              photo.animate(
                [{ opacity: 1 }, { opacity: 0.6 }, { opacity: 1 }],
                { duration: 450, easing: 'ease-out' }
              );
            } catch (err) {}
          }
        }

        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
          if (!a) return;
          var href = a.getAttribute('href') || '';

          if (href === '#demo') {
            e.preventDefault();
            replayShowreel();
          } else if (href === '#stage') {
            e.preventDefault();
            var stage = document.getElementById('stage');
            if (stage && stage.scrollIntoView) {
              stage.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
            }
            replayShowreel();
          }
        });
      })();
    </script>
  </body>
</html>
